services:
  - type: web
    name: calendario-festivos-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: calendario_festivos
      - key: CORS_ORIGIN
        sync: false