services:
  - type: web
    name: calendari-festius-USD
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: calendario_festivos
      - key: CORS_ORIGIN
        sync: false